name: FRKN subscription refresh

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: frkn-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml cryptography

      - name: Run FRKN bot
        run: python frkn_bot.py

      - name: Commit and push subscription config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sub.txt docs/awg.txt docs/awg_configs.zip sub_state.json
          # Шифрование отключено: вернуть при включении age
          # git add docs/clash.yaml.age
          if git diff --cached --quiet; then
            echo "nothing changed; nothing to commit"
          else
            git commit -m "Update FRKN subscription config"
            git push
          fi