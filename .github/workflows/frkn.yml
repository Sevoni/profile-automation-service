name: FRKN subscription refresh

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: frkn-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run FRKN bot
        run: python frkn_bot.py

      - name: Commit and push subscription config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sub.txt docs/awg.txt docs/awg_configs.zip sub_state.json
          if git diff --cached --quiet; then
            echo "docs/sub.txt unchanged; nothing to commit"
          else
            git commit -m "Update FRKN subscription config"
            git push
          fi

      - name: Enable GitHub Pages
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"main","path":"/docs"}}' || echo "Pages already enabled or cannot enable"