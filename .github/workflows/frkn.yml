name: FRKN subscription refresh

on:
  schedule:
    - cron: '0 10 */2 * *'
  workflow_dispatch:

concurrency:
  group: frkn-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      VK_USER_ID: ${{ secrets.VK_USER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run FRKN bot
        run: python frkn_bot.py
